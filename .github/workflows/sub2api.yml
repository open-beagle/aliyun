name: sub2api
on:
  push:
    branches:
      - sub2api
    paths: [sub2api/**, .github/workflows/sub2api.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sub2api-release
  cancel-in-progress: false
env:
  BUILD_VERSION: 0.2.16-fix
  UPSTREAM_COMMIT: 01842576b3d5c1e2545b5a99ad555d36e28ed306
  TARGET_REGISTRY: registry.cn-qingdao.aliyuncs.com/wod/sub2api
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Wei-Shaw/sub2api
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          persist-credentials: false
      - name: Apply release patch
        working-directory: upstream
        run: git apply ../sub2api/grok-scheduler-tier.patch
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing image tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${TARGET_REGISTRY}:${BUILD_VERSION}" > /tmp/image-inspect.log 2>&1; then
            echo "Refusing to overwrite an existing release"
            exit 1
          fi
          if ! grep -qiE 'not found|manifest unknown|404' /tmp/image-inspect.log; then
            cat /tmp/image-inspect.log
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sub2api/dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ env.TARGET_REGISTRY }}:${{ env.BUILD_VERSION }}
          cache-from: type=gha,scope=sub2api-grok
          cache-to: type=gha,mode=max,scope=sub2api-grok
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
            UPSTREAM_COMMIT=${{ env.UPSTREAM_COMMIT }}
