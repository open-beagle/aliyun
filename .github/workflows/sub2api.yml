name: sub2api
on:
  push:
    branches:
      - sub2api
    paths: [sub2api/**, .github/workflows/sub2api.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sub2api-release
  cancel-in-progress: false
env:
  BUILD_VERSION: 0.2.16-fix
  UPSTREAM_REF: v0.2.16
  TARGET_REGISTRY: registry.cn-qingdao.aliyuncs.com/wod/sub2api
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Wei-Shaw/sub2api
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          persist-credentials: false
      - name: Apply release patch
        working-directory: upstream
        run: git apply ../sub2api/grok-scheduler-tier.patch
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sub2api/dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ env.TARGET_REGISTRY }}:${{ env.BUILD_VERSION }}
          cache-from: type=gha,scope=sub2api-grok
          cache-to: type=gha,mode=max,scope=sub2api-grok
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
            UPSTREAM_REF=${{ env.UPSTREAM_REF }}

  deploy:
    name: Deploy API to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBERNETES_SERVER: ${{ secrets.KUBERNETES_ALIYUN_SERVER }}
          KUBERNETES_TOKEN: ${{ secrets.KUBERNETES_ALIYUN_TOKEN }}
          KUBERNETES_CA: ${{ secrets.KUBERNETES_ALIYUN_CA }}
        run: |
          set -eu
          test -n "$KUBERNETES_SERVER"
          test -n "$KUBERNETES_TOKEN"

          if [ -n "$KUBERNETES_CA" ]; then
            ca_file="$RUNNER_TEMP/kubernetes-ca.crt"
            printf '%s\n' "$KUBERNETES_CA" > "$ca_file"
            kubectl config set-cluster beagle-k8s \
              --server="$KUBERNETES_SERVER" \
              --certificate-authority="$ca_file" \
              --embed-certs=true
          else
            kubectl config set-cluster beagle-k8s \
              --server="$KUBERNETES_SERVER" \
              --insecure-skip-tls-verify=true
          fi

          kubectl config set-credentials github-actions --token="$KUBERNETES_TOKEN"
          kubectl config set-context beagle-k8s \
            --cluster=beagle-k8s \
            --user=github-actions \
            --namespace=beagle-cloud-ide
          kubectl config use-context beagle-k8s

      - name: Update API deployment
        run: |
          image="${{ env.TARGET_REGISTRY }}:${{ env.BUILD_VERSION }}"
          kubectl set image deployment/sub2api sub2api="$image"
          kubectl rollout status deployment/sub2api --timeout=5m
          kubectl get deployment/sub2api -o jsonpath='{.spec.template.spec.containers[?(@.name=="sub2api")].image}{"\n"}'
